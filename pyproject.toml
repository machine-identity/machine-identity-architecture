[project]
name = "machine-identity-architecture"
version = "0.1.0"
description = "Reference implementations for the Architecture of Machine Identity research paper"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "base58>=2.1.0",
    "eth-account>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.7.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[project.urls]
Homepage = "https://github.com/machine-identity/machine-identity-architecture"
Repository = "https://github.com/machine-identity/machine-identity-architecture"
Documentation = "https://machine-identity.github.io/machine-identity-architecture"
Issues = "https://github.com/machine-identity/machine-identity-architecture/issues"

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "T20", "ARG", "SIM"]
ignore = ["S101", "PTH118", "PTH123"]
fixable = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "T20", "ARG", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["src"]