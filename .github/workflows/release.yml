name: Release Software to Zenodo

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run tests before release
        run: pytest -v
      - name: Generate changelog
        id: changelog
        run: |
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          git log --oneline --pretty=format:"- %s (%an)" $(git describe --tags --abbrev=0 HEAD^)..HEAD || git log --oneline --pretty=format:"- %s (%an)" -20
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

  zenodo:
    name: Deposit Software to Zenodo
    runs-on: ubuntu-latest
    needs: release
    if: github.repository == 'machine-identity/machine-identity-architecture'
    steps:
      - uses: actions/checkout@v4
      - name: Deposit to Zenodo
        uses: zenodo/zenodo-action@v1
        with:
          zenodo_token: ${{ secrets.ZENODO_TOKEN }}
          deposition_metadata: |
            {
              "title": "Machine Identity Architecture: Reference Implementations",
              "description": "Reference implementations for the research paper: The Architecture of Machine Identity: Sovereign Agents, Economic Autonomy, and the Future of AI Governance",
              "creators": [
                {
                  "name": "Machuca Araya, Jean Rubén",
                  "orcid": "0009-0004-9924-2911"
                }
              ],
              "keywords": ["AI Governance", "Autonomous Agents", "Machine Identity", "W3C DID", "x402", "TEE", "Agentic Web"],
              "license": "MIT",
              "publication_type": "software",
              "version": "${{ github.ref_name }}",
              "related_identifiers": [
                {
                  "relation": "isSupplementTo",
                  "identifier": "10.5281/zenodo.XXXXXXX",
                  "resource_type": "publication"
                }
              ]
            }
          files: |
            [
              "src/",
              "examples/",
              "docs/",
              "README.md",
              "LICENSE",
              "CITATION.cff",
              "pyproject.toml"
            ]
