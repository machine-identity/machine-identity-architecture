name: Release Software to Zenodo

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run tests before release
        run: pytest -v
      - name: Generate changelog
        id: changelog
        run: |
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          git log --oneline --pretty=format:"- %s (%an)" $(git describe --tags --abbrev=0 HEAD^)..HEAD || git log --oneline --pretty=format:"- %s (%an)" -20
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

  zenodo:
    name: Deposit Software to Zenodo
    runs-on: ubuntu-latest
    needs: release
    if: github.repository == 'machine-identity/machine-identity-architecture'
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: pip install requests
      - name: Deposit Software to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_DOI: ${{ secrets.ZENODO_DOI }}
          VERSION: ${{ github.ref_name }}
        run: |
          python << 'EOF'
          import os
          import json
          import requests

          token = os.environ['ZENODO_TOKEN']
          version = os.environ['VERSION']
          existing_doi = os.environ.get('ZENODO_DOI', '')

          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
          }

          # Create or update deposition
          if existing_doi:
              # New version of an existing record
              record_id = existing_doi.split('.')[-1]
              url = f'https://zenodo.org/api/deposit/depositions/{record_id}/actions/newversion'
              r = requests.post(url, headers=headers)
              r.raise_for_status()
              deposition_id = r.json()['id']
          else:
              # Create new
              url = 'https://zenodo.org/api/deposit/depositions'
              r = requests.post(url, headers=headers, json={})
              r.raise_for_status()
              deposition_id = r.json()['id']

          # Upload files
          files = [
              "src",
              "examples",
              "docs",
              "README.md",
              "LICENSE",
              "CITATION.cff",
              "codemeta.json",
              "pyproject.toml"
          ]

          for f in files:
              upload_url = f'https://zenodo.org/api/deposit/depositions/{deposition_id}/files'
              if os.path.isfile(f):
                  with open(f, 'rb') as fp:
                      r = requests.post(upload_url, headers={'Authorization': f'Bearer {token}'}, data={'name': f}, files={'file': fp})
                      r.raise_for_status()
              else:
                  import zipfile
                  import io
                  buf = io.BytesIO()
                  with zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED) as zf:
                      for root, dirs, fnames in os.walk(f):
                          for fn in fnames:
                              full = os.path.join(root, fn)
                              zf.write(full, os.path.relpath(full, '.'))
                  buf.seek(0)
                  r = requests.post(upload_url, headers={'Authorization': f'Bearer {token}'}, data={'name': f + '.zip'}, files={'file': ('archive.zip', buf)})
                  r.raise_for_status()

          # Set metadata
          metadata = {
              "title": "Machine Identity Architecture: Reference Implementations",
              "description": "Reference implementations for the research paper: The Architecture of Machine Identity: Sovereign Agents, Economic Autonomy, and the Future of AI Governance",
              "creators": [{"name": "Machuca Araya, Jean Rubén", "orcid": "0009-0004-9924-2911"}],
              "keywords": ["AI Governance", "Autonomous Agents", "Machine Identity", "W3C DID", "x402", "TEE", "Agentic Web"],
              "license": "MIT",
              "publication_type": "software",
              "version": version,
              "related_identifiers": []
          }
          r = requests.put(
              f'https://zenodo.org/api/deposit/depositions/{deposition_id}',
              headers={**headers, 'Content-Type': 'application/json'},
              json=metadata
          )
          r.raise_for_status()

          # Publish
          r = requests.post(f'https://zenodo.org/api/deposit/depositions/{deposition_id}/actions/publish', headers=headers)
          r.raise_for_status()

          print(f"Published! DOI: {r.json().get('doi', 'check Zenodo')}")
          EOF
